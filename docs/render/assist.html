<!doctype html>
<!-- README / flightsim.to feature card (1920x1080): the pill's warnings and reminders, as pills.js draws them.
     Rendered by docs/render_images.py. -->
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../../src/html_ui/paulcharp-batc-overlay/pill.css">
<link rel="stylesheet" href="common.css">
<style>
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  .card-text { width: 600px; }
  .rows { position: absolute; right: 120px; top: 50%; transform: translateY(-50%); width: 1060px; }
  .row { display: flex; align-items: center; min-height: 150px; }
  .row .cap { width: 380px; flex: none; text-align: right; padding-right: 40px; color: #f2f5f8; }
  .row .cap b { display: block; font: 500 30px/1.2 "Roboto", sans-serif; }
  .row .cap span { font: 400 22px/1.3 "Roboto", sans-serif; color: rgba(242, 245, 248, 0.62); }
</style>
<div class="sky" id="sky"></div>
<div class="card-text">
  <div class="eyebrow">It has your back</div>
  <h2>Never miss a call</h2>
  <div class="sub">The pill turns red-orange when something needs you: ATC calling again or correcting you, a muted
    radio, a handoff to make. It also reminds you to check in, and says when ATC turns you down.</div>
</div>
<div class="rows" id="rows"></div>
<script src="pills.js"></script>
<script src="backdrop.js"></script>
<script>
  BD.draw(document.getElementById("sky"));
  // key, caption, sub-caption
  var ROWS = [
    ["insist", "ATC calls again", "You haven't replied yet"],
    ["negative", "Negative", "ATC corrects your readback"],
    ["muted", "COM1 muted", "ATC calls, you can't hear it"],
    ["contact", "Contact", "The station you were handed to"],
    ["ok", "Readback OK", "ATC took your reply"],
  ];
  document.getElementById("rows").innerHTML = ROWS.map(function (r) {
    return '<div class="row"><div class="cap"><b>' + r[1] + "</b><span>" + r[2] + "</span></div>" + BP.pill(r[0], 3) + "</div>";
  }).join("");
  // as pill.js: each pill as wide as its content
  document.querySelectorAll("#batc-pill").forEach(function (p) {
    var body = p.querySelector(".bp-body");
    body.style.width = "max-content";
    p.style.width = body.offsetWidth + "px";
  });
</script>
